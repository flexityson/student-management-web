<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign up for StudentHub - Teacher Registration">
    <title>Sign Up - StudentHub</title>
    <link rel="stylesheet" href="/src/styles/main.css">
    <link rel="stylesheet" href="/src/styles/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/public/icons/favicon.ico">
</head>
<body>
    <div class="auth-container">
        <main class="auth-card">
            <header class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-graduation-cap" aria-hidden="true"></i>
                    <span>StudentHub</span>
                </div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join thousands of teachers managing their students efficiently</p>
            </header>
            
            <form id="signup-form" novalidate>
                <div id="message-container"></div>
                
                <div class="form-group">
                    <label for="full-name" class="form-label">Full Name</label>
                    <input 
                        type="text" 
                        id="full-name" 
                        name="fullName" 
                        class="form-control" 
                        placeholder="Enter your full name"
                        required
                        autocomplete="name"
                    >
                </div>
                
                <div class="form-group">
                    <label for="school" class="form-label">School Name</label>
                    <input 
                        type="text" 
                        id="school" 
                        name="school" 
                        class="form-control" 
                        placeholder="Enter your school name"
                        required
                        autocomplete="organization"
                    >
                </div>
                
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control" 
                        placeholder="Enter your email address"
                        required
                        autocomplete="email"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control" 
                            placeholder="Create a strong password"
                            required
                            autocomplete="new-password"
                            minlength="6"
                        >
                        <button type="button" class="password-toggle" id="password-toggle" aria-label="Toggle password visibility">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div id="password-strength" class="password-strength"></div>
                </div>
                
                <div class="form-group">
                    <label for="confirm-password" class="form-label">Confirm Password</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="confirm-password" 
                            name="confirmPassword" 
                            class="form-control" 
                            placeholder="Confirm your password"
                            required
                            autocomplete="new-password"
                        >
                        <button type="button" class="password-toggle" id="confirm-password-toggle" aria-label="Toggle password visibility">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="teacher-access-code" class="form-label">Secret Access Code</label>
                    <input 
                        type="text" 
                        id="teacher-access-code" 
                        name="teacherAccessCode" 
                        class="form-control" 
                        placeholder="Enter your secret access code"
                        required
                        autocomplete="off"
                    >
                    <small style="color: var(--color-text-muted); font-size: 0.75rem; margin-top: 0.25rem; display: block;">
                        This code is required to create a teacher account
                    </small>
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        <input 
                            type="checkbox" 
                            id="terms" 
                            name="terms" 
                            required
                            style="margin-right: var(--space-2);"
                        >
                        I agree to the <a href="/terms.html" target="_blank">Terms of Service</a> and <a href="/privacy.html" target="_blank">Privacy Policy</a>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary" id="signup-btn">
                    <span id="signup-text">Create Account</span>
                    <div id="signup-spinner" class="loading-spinner" style="display: none;"></div>
                </button>
            </form>
            
            <footer class="auth-footer">
                <p>Already have an account? <a href="/login.html">Sign in</a></p>
            </footer>
        </main>
    </div>
    
    <script type="module">
        import { auth, utils } from '/src/js/supabaseClient.js';
        import { 
            showMessage, 
            togglePasswordVisibility, 
            validateEmail, 
            validatePassword, 
            clearErrorStates, 
            setLoadingState, 
            handleUrlMessages, 
            checkPasswordStrength 
        } from '/src/js/auth-common.js';
        
        // DOM elements
        const form = document.getElementById('signup-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const fullNameInput = document.getElementById('full-name');
        const schoolInput = document.getElementById('school');
        const teacherAccessCodeInput = document.getElementById('teacher-access-code');
        const termsCheckbox = document.getElementById('terms');
        const signupBtn = document.getElementById('signup-btn');
        const signupText = document.getElementById('signup-text');
        const signupSpinner = document.getElementById('signup-spinner');
        const messageContainer = document.getElementById('message-container');
        const passwordStrength = document.getElementById('password-strength');
        
        // Password visibility toggles
        const passwordToggle = document.getElementById('password-toggle');
        const confirmPasswordToggle = document.getElementById('confirm-password-toggle');
        
        // Toggle password visibility
        passwordToggle.addEventListener('click', () => {
            togglePasswordVisibility(passwordInput, passwordToggle);
        });
        
        confirmPasswordToggle.addEventListener('click', () => {
            togglePasswordVisibility(confirmPasswordInput, confirmPasswordToggle);
        });
        
        // Password strength checker
        passwordInput.addEventListener('input', (e) => {
            const { feedback, className } = checkPasswordStrength(e.target.value);
            passwordStrength.textContent = feedback;
            passwordStrength.className = className;
        });
        
        // Validate form
        function validateForm() {
            const fullName = fullNameInput.value.trim();
            const school = schoolInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const teacherAccessCode = teacherAccessCodeInput.value.trim();
            const termsAccepted = termsCheckbox.checked;
            
            clearErrorStates(
                fullNameInput, 
                schoolInput, 
                emailInput, 
                passwordInput, 
                confirmPasswordInput, 
                teacherAccessCodeInput
            );
            
            let isValid = true;
            
            if (!fullName) {
                fullNameInput.classList.add('form-error');
                isValid = false;
            }
            
            if (!school) {
                schoolInput.classList.add('form-error');
                isValid = false;
            }
            
            if (!validateEmail(email)) {
                emailInput.classList.add('form-error');
                isValid = false;
            }
            
            if (!validatePassword(password)) {
                passwordInput.classList.add('form-error');
                showMessage(messageContainer, 'Password must be at least 6 characters long');
                isValid = false;
            }
            
            if (password !== confirmPassword) {
                confirmPasswordInput.classList.add('form-error');
                showMessage(messageContainer, 'Passwords do not match');
                isValid = false;
            }
            
            if (!teacherAccessCode) {
                teacherAccessCodeInput.classList.add('form-error');
                showMessage(messageContainer, 'Secret access code is required');
                isValid = false;
            }
            
            if (!termsAccepted) {
                showMessage(messageContainer, 'Please accept the Terms of Service and Privacy Policy');
                isValid = false;
            }
            
            return isValid;
        }
        
        // Handle form submission
        async function handleSignup(e) {
            e.preventDefault();
            
            if (!validateForm()) {
                return;
            }
            
            const fullName = fullNameInput.value.trim();
            const school = schoolInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const teacherAccessCode = teacherAccessCodeInput.value.trim();
            
            setLoadingState(signupBtn, signupText, signupSpinner, true);
            
            try {
                // First validate the teacher access code via serverless function
                const validateResponse = await fetch('/api/validate-teacher', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ accessCode: teacherAccessCode }),
                });
                
                const validateData = await validateResponse.json();
                
                if (!validateData.success) {
                    if (validateData.message === 'Fail') {
                        alert('Unauthorized Access');
                    } else {
                        showMessage(messageContainer, validateData.message || 'Access code validation failed');
                    }
                    return;
                }
                
                // If access code is valid, proceed with Supabase signup
                const result = await auth.signUp(email, password, {
                    fullName,
                    school,
                });
                
                if (result.success) {
                    showMessage(
                        messageContainer,
                        'Account created successfully! Please check your email to verify your account before signing in.',
                        'success'
                    );
                    
                    // Clear form
                    form.reset();
                    passwordStrength.textContent = '';
                    
                    // Redirect to login after 3 seconds
                    setTimeout(() => {
                        window.location.href = '/login.html?message=account_created';
                    }, 3000);
                } else {
                    showMessage(messageContainer, utils.handleAuthError(result.error));
                }
            } catch (error) {
                showMessage(messageContainer, 'An unexpected error occurred. Please try again.');
                console.error('Signup error:', error);
            } finally {
                setLoadingState(signupBtn, signupText, signupSpinner, false);
            }
        }
        
        // Event listeners
        form.addEventListener('submit', handleSignup);
        
        // Clear error states on input
        [
            fullNameInput, 
            schoolInput, 
            emailInput, 
            passwordInput, 
            confirmPasswordInput, 
            teacherAccessCodeInput
        ].forEach(input => {
            input.addEventListener('input', () => {
                input.classList.remove('form-error');
            });
        });
        
        // Check for redirect message
        handleUrlMessages(messageContainer);
    </script>
</body>
</html>
