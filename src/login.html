<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to StudentHub - Teacher Login">
    <title>Sign In - StudentHub</title>
    <link rel="stylesheet" href="/src/styles/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/public/icons/favicon.ico">
    <style>
        /* Additional styles for auth pages */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--color-primary-600), var(--color-primary-400));
            padding: var(--space-4);
        }
        
        .auth-card {
            background: var(--color-surface);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-2xl);
            width: 100%;
            max-width: 480px;
            padding: var(--space-8);
            position: relative;
            overflow: hidden;
        }
        
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--color-primary-600), var(--color-primary-400));
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: var(--space-8);
        }
        
        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-3);
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-primary-600);
            margin-bottom: var(--space-4);
        }
        
        .auth-title {
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-primary);
            margin-bottom: var(--space-2);
        }
        
        .auth-subtitle {
            color: var(--color-text-secondary);
            font-size: var(--font-size-base);
        }
        
        .form-group {
            margin-bottom: var(--space-5);
        }
        
        .form-label {
            display: block;
            margin-bottom: var(--space-2);
            font-weight: var(--font-weight-medium);
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
        }
        
        .form-control {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            font-size: var(--font-size-sm);
            background-color: var(--color-surface);
            color: var(--color-text-primary);
            transition: var(--transition-all);
            font-family: inherit;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--color-primary-600);
            box-shadow: 0 0 0 3px rgba(107, 70, 193, 0.1);
        }
        
        .form-control::placeholder {
            color: var(--color-text-muted);
        }
        
        .password-input-wrapper {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: var(--space-3);
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--color-text-muted);
            cursor: pointer;
            padding: var(--space-1);
            border-radius: var(--radius-sm);
            transition: var(--transition-colors);
        }
        
        .password-toggle:hover {
            color: var(--color-text-primary);
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-6);
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }
        
        .remember-me input[type="checkbox"] {
            width: auto;
        }
        
        .remember-me label {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            cursor: pointer;
        }
        
        .forgot-password {
            font-size: var(--font-size-sm);
        }
        
        .forgot-password a {
            color: var(--color-primary-600);
            text-decoration: none;
            font-weight: var(--font-weight-medium);
        }
        
        .forgot-password a:hover {
            color: var(--color-primary-700);
            text-decoration: underline;
        }
        
        .btn {
            width: 100%;
            padding: var(--space-4);
            border-radius: var(--radius-lg);
            font-weight: var(--font-weight-semibold);
            font-size: var(--font-size-base);
            font-family: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition-all);
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
        }
        
        .btn-primary {
            background-color: var(--color-primary-600);
            color: var(--color-text-on-primary);
            border-color: var(--color-primary-600);
        }
        
        .btn-primary:hover:not(:disabled) {
            background-color: var(--color-primary-700);
            border-color: var(--color-primary-700);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: var(--space-6);
            padding-top: var(--space-6);
            border-top: 1px solid var(--color-border);
        }
        
        .auth-footer p {
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
            margin-bottom: 0;
        }
        
        .auth-footer a {
            color: var(--color-primary-600);
            text-decoration: none;
            font-weight: var(--font-weight-medium);
        }
        
        .auth-footer a:hover {
            color: var(--color-primary-700);
            text-decoration: underline;
        }
        
        .error-message {
            background-color: var(--color-error-bg);
            border: 1px solid var(--color-error-border);
            color: var(--color-error);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-lg);
            font-size: var(--font-size-sm);
            margin-bottom: var(--space-4);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }
        
        .success-message {
            background-color: var(--color-success-bg);
            border: 1px solid var(--color-success-border);
            color: var(--color-success);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-lg);
            font-size: var(--font-size-sm);
            margin-bottom: var(--space-4);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .auth-card {
                padding: var(--space-6);
                margin: var(--space-4);
            }
            
            .auth-title {
                font-size: var(--font-size-2xl);
            }
            
            .form-options {
                flex-direction: column;
                gap: var(--space-3);
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <main class="auth-card">
            <header class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-graduation-cap" aria-hidden="true"></i>
                    <span>StudentHub</span>
                </div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to manage your students efficiently</p>
            </header>
            
            <form id="login-form" novalidate>
                <div id="message-container"></div>
                
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control" 
                        placeholder="Enter your email address"
                        required
                        autocomplete="email"
                        autofocus
                    >
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control" 
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="password-toggle" id="password-toggle" aria-label="Toggle password visibility">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <div class="forgot-password">
                        <a href="/forgot-password.html">Forgot password?</a>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" id="login-btn">
                    <span id="login-text">Sign In</span>
                    <div id="login-spinner" class="loading-spinner" style="display: none;"></div>
                </button>
            </form>
            
            <footer class="auth-footer">
                <p>Don't have an account? <a href="/signup.html">Sign up</a></p>
            </footer>
        </main>
    </div>
    
    <script type="module">
        import { auth, utils } from '/src/js/supabaseClient.js';
        
        // DOM elements
        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberCheckbox = document.getElementById('remember');
        const loginBtn = document.getElementById('login-btn');
        const loginText = document.getElementById('login-text');
        const loginSpinner = document.getElementById('login-spinner');
        const messageContainer = document.getElementById('message-container');
        const passwordToggle = document.getElementById('password-toggle');
        
        // Toggle password visibility
        passwordToggle.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            passwordToggle.innerHTML = type === 'password' 
                ? '<i class="fas fa-eye" aria-hidden="true"></i>'
                : '<i class="fas fa-eye-slash" aria-hidden="true"></i>';
        });
        
        // Show message function
        function showMessage(message, type = 'error') {
            const messageClass = type === 'success' ? 'success-message' : 'error-message';
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            
            messageContainer.innerHTML = `
                <div class="${messageClass}">
                    <i class="fas ${icon}" aria-hidden="true"></i>
                    <span>${message}</span>
                </div>
            `;
            
            // Auto-hide success messages after 3 seconds
            if (type === 'success') {
                setTimeout(() => {
                    messageContainer.innerHTML = '';
                }, 3000);
            }
        }
        
        // Validate form
        function validateForm() {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            // Reset previous states
            emailInput.classList.remove('form-error');
            passwordInput.classList.remove('form-error');
            
            let isValid = true;
            
            if (!email || !email.includes('@')) {
                emailInput.classList.add('form-error');
                isValid = false;
            }
            
            if (!password) {
                passwordInput.classList.add('form-error');
                isValid = false;
            }
            
            return isValid;
        }
        
        // Handle form submission
        async function handleLogin(e) {
            e.preventDefault();
            
            if (!validateForm()) {
                showMessage('Please fill in all required fields correctly');
                return;
            }
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const remember = rememberCheckbox.checked;
            
            // Show loading state
            loginBtn.disabled = true;
            loginText.style.display = 'none';
            loginSpinner.style.display = 'inline-block';
            
            try {
                const result = await auth.signIn(email, password);
                
                if (result.success) {
                    showMessage('Signing in...', 'success');
                    
                    // Store remember me preference
                    if (remember) {
                        localStorage.setItem('rememberEmail', email);
                    } else {
                        localStorage.removeItem('rememberEmail');
                    }
                    
                    // Redirect to dashboard or stored URL
                    const redirectUrl = utils.getRedirectUrl();
                    setTimeout(() => {
                        window.location.href = redirectUrl;
                    }, 1000);
                } else {
                    showMessage(utils.handleAuthError(result.error));
                }
            } catch (error) {
                showMessage('An unexpected error occurred. Please try again.');
                console.error('Login error:', error);
            } finally {
                // Hide loading state
                loginBtn.disabled = false;
                loginText.style.display = 'inline';
                loginSpinner.style.display = 'none';
            }
        }
        
        // Event listeners
        form.addEventListener('submit', handleLogin);
        
        // Clear error states on input
        [emailInput, passwordInput].forEach(input => {
            input.addEventListener('input', () => {
                input.classList.remove('form-error');
            });
        });
        
        // Check for URL parameters and messages
        const urlParams = new URLSearchParams(window.location.search);
        const message = urlParams.get('message');
        
        if (message === 'account_created') {
            showMessage('Account created successfully! Please sign in.', 'success');
        } else if (message === 'session_expired') {
            showMessage('Your session has expired. Please sign in again.');
        } else if (message === 'password_reset') {
            showMessage('Password reset successfully! Please sign in with your new password.', 'success');
        }
        
        // Auto-fill remembered email
        const rememberedEmail = localStorage.getItem('rememberEmail');
        if (rememberedEmail) {
            emailInput.value = rememberedEmail;
            rememberCheckbox.checked = true;
            passwordInput.focus();
        }
        
        // Check if user is already authenticated
        auth.getCurrentUser().then(({ success, session }) => {
            if (success && session) {
                // User is already logged in, redirect to dashboard
                window.location.href = '/index.html';
            }
        });
    </script>
</body>
</html>
