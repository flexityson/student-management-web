<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to StudentHub - Teacher Login">
    <title>Sign In - StudentHub</title>
    <link rel="stylesheet" href="/src/styles/main.css">
    <link rel="stylesheet" href="/src/styles/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/public/icons/favicon.ico">
</head>
<body>
    <div class="auth-container">
        <main class="auth-card">
            <header class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-graduation-cap" aria-hidden="true"></i>
                    <span>StudentHub</span>
                </div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to manage your students efficiently</p>
            </header>
            
            <form id="login-form" novalidate>
                <div id="message-container"></div>
                
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control" 
                        placeholder="Enter your email address"
                        required
                        autocomplete="email"
                        autofocus
                    >
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control" 
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="password-toggle" id="password-toggle" aria-label="Toggle password visibility">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <div class="forgot-password">
                        <a href="/forgot-password.html">Forgot password?</a>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" id="login-btn">
                    <span id="login-text">Sign In</span>
                    <div id="login-spinner" class="loading-spinner" style="display: none;"></div>
                </button>
            </form>
            
            <footer class="auth-footer">
                <p>Don't have an account? <a href="/signup.html">Sign up</a></p>
            </footer>
        </main>
    </div>
    
    <script type="module">
        import { auth, utils } from '/src/js/supabaseClient.js';
        import { 
            showMessage, 
            togglePasswordVisibility, 
            validateEmail, 
            validatePassword, 
            clearErrorStates, 
            setLoadingState, 
            handleUrlMessages, 
            handleRememberedEmail 
        } from '/src/js/auth-common.js';
        
        // DOM elements
        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberCheckbox = document.getElementById('remember');
        const loginBtn = document.getElementById('login-btn');
        const loginText = document.getElementById('login-text');
        const loginSpinner = document.getElementById('login-spinner');
        const messageContainer = document.getElementById('message-container');
        const passwordToggle = document.getElementById('password-toggle');
        
        // Toggle password visibility
        passwordToggle.addEventListener('click', () => {
            togglePasswordVisibility(passwordInput, passwordToggle);
        });
        
        // Validate form
        function validateForm() {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            clearErrorStates(emailInput, passwordInput);
            
            let isValid = true;
            
            if (!validateEmail(email)) {
                emailInput.classList.add('form-error');
                isValid = false;
            }
            
            if (!validatePassword(password)) {
                passwordInput.classList.add('form-error');
                isValid = false;
            }
            
            return isValid;
        }
        
        // Handle form submission
        async function handleLogin(e) {
            e.preventDefault();
            
            if (!validateForm()) {
                showMessage(messageContainer, 'Please fill in all required fields correctly');
                return;
            }
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const remember = rememberCheckbox.checked;
            
            setLoadingState(loginBtn, loginText, loginSpinner, true);
            
            try {
                const result = await auth.signIn(email, password);
                
                if (result.success) {
                    showMessage(messageContainer, 'Signing in...', 'success');
                    
                    // Store remember me preference
                    if (remember) {
                        localStorage.setItem('rememberEmail', email);
                    } else {
                        localStorage.removeItem('rememberEmail');
                    }
                    
                    // Redirect to dashboard or stored URL
                    const redirectUrl = utils.getRedirectUrl();
                    setTimeout(() => {
                        window.location.href = redirectUrl;
                    }, 1000);
                } else {
                    showMessage(messageContainer, utils.handleAuthError(result.error));
                }
            } catch (error) {
                showMessage(messageContainer, 'An unexpected error occurred. Please try again.');
                console.error('Login error:', error);
            } finally {
                setLoadingState(loginBtn, loginText, loginSpinner, false);
            }
        }
        
        // Event listeners
        form.addEventListener('submit', handleLogin);
        
        // Clear error states on input
        [emailInput, passwordInput].forEach(input => {
            input.addEventListener('input', () => {
                input.classList.remove('form-error');
            });
        });
        
        // Check for URL parameters and messages
        handleUrlMessages(messageContainer);
        
        // Auto-fill remembered email
        if (handleRememberedEmail(emailInput, rememberCheckbox)) {
            passwordInput.focus();
        }
        
        // Check if user is already authenticated
        auth.getCurrentUser().then(({ success, session }) => {
            if (success && session) {
                // User is already logged in, redirect to dashboard
                window.location.href = '/index.html';
            }
        });
    </script>
</body>
</html>
